apiVersion: apps/v1
kind: Deployment
metadata: 
  name: frontend-deployment
  namespace: chat-app
  labels:
    app: frontend
spec:
  replicas: 2
  template:
    metadata:
      name: frontend-pod
      namespace: chat-app
      labels:
        app: frontend
    spec:
      containers:
      - name: chatapp-frontend
        image: softconsist/chatapp-frontend:latest
        ports:
        -  containerPort: 80
        env:
        - name: NODE_ENV
          value: production
  selector: 
    matchLabels:
      app: frontend
