kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: my-cluster
nodes:
- role: control-plane
  image: kindest/node:v1.31.2
  extraPortMappings:
  - containerPort: 30080
    hostPort: 8080
  - containerPort: 30501
    hostPort: 5001
  - containerPort: 27017
    hostPort: 27017
- role: worker
  image: kindest/node:v1.31.2
