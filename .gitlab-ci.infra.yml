stages:
  - validate
  - plan
  - apply

variables:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"


validate_eks:
  stage: validate
  script:
    - cd infra/eks
    - terraform init
    - terraform validate
  tags:
    - self-hosted


plan_eks:
  stage: plan
  script:
    - cd infra/eks
    - terraform plan -out=tfplan
  needs: ["validate_eks"]
  tags:
    - self-hosted
  artifacts:
    paths:
      - infra/eks/tfplan
    expire_in: 1 hour


apply_eks:
  stage: apply
  script:
    - cd infra/eks
    - terraform apply -auto-approve tfplan
  when: manual
  needs: ["plan_eks"]
  tags:
    - self-hosted
