version: '3.8'

services:
  mongo:
    image: mongo
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - fullstack

  backend:
    build:
      context: ./backend
    container_name: backend
    ports:
      - "5001:5001"
    env_file:
      - ./backend/.env
    depends_on:
      - mongo
    networks:
      - fullstack

  frontend:
    build:
      context: ./frontend
    container_name: frontend
    ports:
      - "8081:80"
  
    depends_on:
      - backend
    networks:
      - fullstack

volumes:
  mongo_data:

networks:
  fullstack:
    driver: bridge

