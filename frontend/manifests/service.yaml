apiVersion: v1
kind: Service
metadata:
  name: frontend-svc
  namespace: frontend
spec:
  type: ClusterIP
  selector:
    app: chat-frontend-ds
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP

---

apiVersion: v1
kind: Service
metadata:
  name: backend
 # is necessary because both frontend and backend are on different namesapce
  namespace: frontend
spec:
  type: ExternalName
  externalName: backend.backend.svc.cluster.local
